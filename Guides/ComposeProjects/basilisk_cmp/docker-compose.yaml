services:

  basilisk_db:
    container_name: basilisk_db
    image: bobywidjaja/basilisk-database:1.0
    environment:
      - ACCEPT_EULA=y
      - SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - sqlserver_vol:/var/opt/mssql
    build:
      context: Database
      dockerfile: Dockerfile
    networks:
      - basilisk_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmithWessonMagnum357!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  basilisk_be:
    container_name: basilisk_be
    image: bobywidjaja/basilisk-backend:1.0
    ports:
      - "8005:8005"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    build:
      context: Backend
      dockerfile: Dockerfile
    depends_on:
      basilisk_db:
        condition: service_healthy
    restart: on-failure
    networks:
      - basilisk_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  basilisk_fe:
    container_name: basilisk_fe
    image: bobywidjaja/basilisk-frontend:1.0
    ports:
      - "8006:8006"
    build:
      context: Frontend
      dockerfile: Dockerfile
    depends_on:
      basilisk_be:
        condition: service_healthy
    networks:
      - basilisk_net

#menggunakan existing volume yang sudah dibuat pada Guides/ComposeProjects/basilisk
volumes:
  sqlserver_vol:
    name: sqlserver_vol
    external: true

networks:
  basilisk_net:
    name: basilisk_net
    driver: bridge