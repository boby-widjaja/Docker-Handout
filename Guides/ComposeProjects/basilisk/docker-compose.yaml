services:

  basilisk_db:
    container_name: basilisk_db
    image: basilisk-database:1.0
    environment:
      - ACCEPT_EULA=y
      - SA_PASSWORD=SmithWessonMagnum357!
    volumes:
      - sqlserver_vol:/var/opt/mssql
    build:
      context: Database
      dockerfile: Dockerfile
    networks:
      - basilisk_net

  basilisk_be:
    container_name: basilisk_be
    image: basilisk-backend:1.0
    ports:
      - "8005:8005"
    environment:
      - DB_PASSWORD=SmithWessonMagnum357!
    build:
      context: Backend
      dockerfile: Dockerfile
    depends_on:
      - basilisk_db
    restart: on-failure
    networks:
      - basilisk_net

  basilisk_fe:
    container_name: basilisk_fe
    image: basilisk-frontend:1.0
    ports:
      - "8006:8006"
    build:
      context: Frontend
      dockerfile: Dockerfile
    depends_on:
      - basilisk_be
    networks:
      - basilisk_net

volumes:
  sqlserver_vol:
    name: sqlserver_vol

networks:
  basilisk_net:
    name: basilisk_net
    driver: bridge