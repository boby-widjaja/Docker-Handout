services:
  sqlserver:
    image: sqlserver-secret:1.0
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_volume:/var/opt/mssql
    secrets:
      - mssql_sa_password
    deploy:
      replicas: 1
volumes:
  sqlserver_volume:
    external: true
secrets:
  mssql_sa_password:
    external: true